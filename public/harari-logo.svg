<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4a2080"/>
      <stop offset="100%" stop-color="#2a0f50"/>
    </radialGradient>
    <radialGradient id="innerGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5a2a9a"/>
      <stop offset="100%" stop-color="#3a1570"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e4c97a"/>
      <stop offset="50%" stop-color="#c9a84c"/>
      <stop offset="100%" stop-color="#a07c2e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Outer decorative ring with gear/sun teeth -->
  <circle cx="100" cy="100" r="96" fill="url(#goldGrad)" />

  <!-- Gear teeth around outer edge -->
  <g fill="url(#goldGrad)">
    <rect x="97" y="2"  width="6" height="14" rx="2" transform="rotate(0   100 100)"/>
    <rect x="97" y="2"  width="6" height="14" rx="2" transform="rotate(15  100 100)"/>
    <rect x="97" y="2"  width="6" height="14" rx="2" transform="rotate(30  100 100)"/>
    <rect x="97" y="2"  width="6" height="14" rx="2" transform="rotate(45  100 100)"/>
    <rect x="97" y="2"  width="6" height="14" rx="2" transform="rotate(60  100 100)"/>
    <rect x="97" y="2"  width="6" height="14" rx="2" transform="rotate(75  100 100)"/>
    <rect x="97" y="2"  width="6" height="14" rx="2" transform="rotate(90  100 100)"/>
    <rect x="97" y="2"  width="6" height="14" rx="2" transform="rotate(105 100 100)"/>
    <rect x="97" y="2"  width="6" height="14" rx="2" transform="rotate(120 100 100)"/>
    <rect x="97" y="2"  width="6" height="14" rx="2" transform="rotate(135 100 100)"/>
    <rect x="97" y="2"  width="6" height="14" rx="2" transform="rotate(150 100 100)"/>
    <rect x="97" y="2"  width="6" height="14" rx="2" transform="rotate(165 100 100)"/>
    <rect x="97" y="2"  width="6" height="14" rx="2" transform="rotate(180 100 100)"/>
    <rect x="97" y="2"  width="6" height="14" rx="2" transform="rotate(195 100 100)"/>
    <rect x="97" y="2"  width="6" height="14" rx="2" transform="rotate(210 100 100)"/>
    <rect x="97" y="2"  width="6" height="14" rx="2" transform="rotate(225 100 100)"/>
    <rect x="97" y="2"  width="6" height="14" rx="2" transform="rotate(240 100 100)"/>
    <rect x="97" y="2"  width="6" height="14" rx="2" transform="rotate(255 100 100)"/>
    <rect x="97" y="2"  width="6" height="14" rx="2" transform="rotate(270 100 100)"/>
    <rect x="97" y="2"  width="6" height="14" rx="2" transform="rotate(285 100 100)"/>
    <rect x="97" y="2"  width="6" height="14" rx="2" transform="rotate(300 100 100)"/>
    <rect x="97" y="2"  width="6" height="14" rx="2" transform="rotate(315 100 100)"/>
    <rect x="97" y="2"  width="6" height="14" rx="2" transform="rotate(330 100 100)"/>
    <rect x="97" y="2"  width="6" height="14" rx="2" transform="rotate(345 100 100)"/>
  </g>

  <!-- Main purple circle -->
  <circle cx="100" cy="100" r="82" fill="url(#bgGrad)" />

  <!-- Inner gold ring -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <circle cx="100" cy="100" r="76" fill="none" stroke="url(#goldGrad)" stroke-width="1"/>

  <!-- Inner purple circle -->
  <circle cx="100" cy="100" r="73" fill="url(#innerGrad)" />

  <!-- 8-pointed star at top (Harari symbol) -->
  <g filter="url(#glow)">
    <polygon points="100,32 103,42 113,42 105,48 108,58 100,52 92,58 95,48 87,42 97,42"
      fill="url(#goldGrad)" />
  </g>

  <!-- Decorative dots circle around star -->
  <g fill="url(#goldGrad)" opacity="0.7">
    <circle cx="100" cy="28" r="1.5" transform="rotate(0   100 100)"/>
    <circle cx="100" cy="28" r="1.5" transform="rotate(30  100 100)"/>
    <circle cx="100" cy="28" r="1.5" transform="rotate(60  100 100)"/>
    <circle cx="100" cy="28" r="1.5" transform="rotate(90  100 100)"/>
    <circle cx="100" cy="28" r="1.5" transform="rotate(120 100 100)"/>
    <circle cx="100" cy="28" r="1.5" transform="rotate(150 100 100)"/>
    <circle cx="100" cy="28" r="1.5" transform="rotate(180 100 100)"/>
    <circle cx="100" cy="28" r="1.5" transform="rotate(210 100 100)"/>
    <circle cx="100" cy="28" r="1.5" transform="rotate(240 100 100)"/>
    <circle cx="100" cy="28" r="1.5" transform="rotate(270 100 100)"/>
    <circle cx="100" cy="28" r="1.5" transform="rotate(300 100 100)"/>
    <circle cx="100" cy="28" r="1.5" transform="rotate(330 100 100)"/>
  </g>

  <!-- Balance scale (justice) - center top area -->
  <!-- Scale beam -->
  <line x1="80" y1="70" x2="120" y2="70" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
  <!-- Center post -->
  <line x1="100" y1="65" x2="100" y2="78" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
  <!-- Scale pans -->
  <path d="M72,70 Q74,76 80,76 Q86,76 88,70" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <path d="M112,70 Q114,76 120,76 Q126,76 128,70" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <line x1="80" y1="70" x2="80" y2="70" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <line x1="120" y1="70" x2="120" y2="70" stroke="url(#goldGrad)" stroke-width="1.5"/>

  <!-- Castle / Jugol Wall (Harar heritage) -->
  <!-- Main wall base -->
  <rect x="72" y="110" width="56" height="24" rx="2" fill="url(#goldGrad)" opacity="0.9"/>
  <!-- Battlements / merlons -->
  <rect x="72"  y="103" width="8"  height="10" rx="1" fill="url(#goldGrad)"/>
  <rect x="84"  y="103" width="8"  height="10" rx="1" fill="url(#goldGrad)"/>
  <rect x="96"  y="103" width="8"  height="10" rx="1" fill="url(#goldGrad)"/>
  <rect x="108" y="103" width="8"  height="10" rx="1" fill="url(#goldGrad)"/>
  <rect x="120" y="103" width="8"  height="10" rx="1" fill="url(#goldGrad)"/>
  <!-- Gate arch -->
  <path d="M91,134 L91,122 Q100,114 109,122 L109,134 Z" fill="#3a1570"/>
  <!-- Tower left -->
  <rect x="66"  y="100" width="12" height="36" rx="2" fill="url(#goldGrad)" opacity="0.85"/>
  <rect x="64"  y="95"  width="7"  height="8"  rx="1" fill="url(#goldGrad)"/>
  <rect x="71"  y="95"  width="7"  height="8"  rx="1" fill="url(#goldGrad)"/>
  <!-- Tower right -->
  <rect x="122" y="100" width="12" height="36" rx="2" fill="url(#goldGrad)" opacity="0.85"/>
  <rect x="122" y="95"  width="7"  height="8"  rx="1" fill="url(#goldGrad)"/>
  <rect x="129" y="95"  width="7"  height="8"  rx="1" fill="url(#goldGrad)"/>

  <!-- Gear / wheel (industry) at bottom center -->
  <g transform="translate(100,155)">
    <circle cx="0" cy="0" r="9" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="3" fill="url(#goldGrad)"/>
    <g stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round">
      <line x1="0" y1="-13" x2="0" y2="-9"/>
      <line x1="0" y1="9"   x2="0" y2="13"/>
      <line x1="-13" y1="0" x2="-9" y2="0"/>
      <line x1="9"   y1="0" x2="13" y2="0"/>
      <line x1="-9.2" y1="-9.2" x2="-6.4" y2="-6.4"/>
      <line x1="6.4"  y1="6.4"  x2="9.2"  y2="9.2"/>
      <line x1="9.2"  y1="-9.2" x2="6.4"  y2="-6.4"/>
      <line x1="-6.4" y1="6.4"  x2="-9.2" y2="9.2"/>
    </g>
  </g>

  <!-- Bottom decorative arc text band -->
  <circle cx="100" cy="100" r="68" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="3,4" opacity="0.5"/>

  <!-- Outer gold band bottom -->
  <path d="M 30,155 A 80,80 0 0,0 170,155" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.6"/>
</svg>
